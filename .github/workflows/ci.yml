name: macOS build and tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: macos-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos:
    name: Test and package macOS app
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - name: Check out sources
        uses: actions/checkout@v4
      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version
      - name: Check shell scripts
        run: bash -n scripts/build-app.sh scripts/verify-app.sh
      - name: Test core and presentation
        run: swift test --parallel
      - name: Build and verify universal app
        run: ./scripts/build-app.sh
      - name: Save app archive
        uses: actions/upload-artifact@v4
        with:
          name: CallBar-macOS-universal
          path: dist/CallBar-macOS-universal.zip
          if-no-files-found: error
          retention-days: 14
